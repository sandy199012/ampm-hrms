# fly.toml — Fly.io configuration for AmpmHrmsPro
# Region: sin = Singapore (India ke sabse paas free region)
app = 'ampm-hrms'
primary_region = 'sin'

[build]
  # Dockerfile in same directory as this file

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS        = 'http://+:8080'

# Persistent volume — SQLite DB yahan store hoga, deploy ke baad bhi safe
[[mounts]]
  source      = 'hrms_data'
  destination = '/data'

[[services]]
  protocol    = 'tcp'
  internal_port = 8080
  auto_stop_machines  = false   # Always on — free tier mein 1 machine free hai
  auto_start_machines = true

  [[services.ports]]
    port     = 80
    handlers = ['http']

  [[services.ports]]
    port     = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type       = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
