<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /app/` -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="AMPM Fashions HRMS: attendance, punch, leave, WFH and approvals.">
  <meta name="theme-color" content="#723E28">

  <!-- iPhone: "Add to Home Screen" opens full-screen like an app, with the AMPM icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AMPM HRMS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>AMPM HRMS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #723E28; }
    #ampm-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 26px;
      background: linear-gradient(135deg, #85492F, #723E28 55%, #4A2618);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #ampm-splash img { width: 112px; height: 112px; border-radius: 26px; border: 5px solid #fff;
      box-shadow: 0 12px 30px rgba(0,0,0,.25); }
    #ampm-splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
    #ampm-splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #fff;
      border-radius: 3px; animation: ampm-load 1.1s ease-in-out infinite; }
    #ampm-splash .txt { color: rgba(255,255,255,.75); font-size: 13px; letter-spacing: .4px; }
    @keyframes ampm-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="ampm-splash">
    <img src="icons/Icon-192.png" alt="AMPM">
    <div class="bar"></div>
    <div class="txt">Loading AMPM HRMS…</div>
  </div>
  <script>
    // Hide the splash once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('ampm-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 350); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
